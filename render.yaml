
# ShuttleTrack - Free Render Deployment
# Backend: Render Free Web Service
# Frontend: Render Free Static Site
# Database: Neon PostgreSQL

services:
  # 1. Backend API
  - type: web
    name: shuttletrack-api
    runtime: node
    region: oregon
    plan: free
    numInstances: 1

    buildCommand: npm ci --include=dev && npm run build:api

    startCommand: npm run db:deploy && npm run seed:admin --workspace @shuttletrack/backend && npm run start:api

    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: CORS_ORIGINS
        sync: false

  # 2. Frontend Website
  - type: web
    name: shuttletrack-web
    runtime: static

    buildCommand: npm ci --include=dev && npm run build:render

    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: VITE_API_URL
        sync: false

      - key: VITE_SOCKET_URL
        sync: false
